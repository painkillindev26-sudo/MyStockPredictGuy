services:
  - type: web
    name: product-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATA_DIR
        value: /tmp/product-agent-data
    disk:
      name: product-agent-data
      mountPath: /tmp/product-agent-data
